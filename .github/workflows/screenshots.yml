name: Capture README screenshots
on:
  push:
    branches:
      - 'automation/capture-*'
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Render real WPF windows with demonstration data
        timeout-minutes: 3
        run: dotnet run --project tests/UiSmoke.Tests/UiSmoke.Tests.csproj -c Release -- --screenshots-only
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ReleasePilot-screenshots
          path: docs/screenshots/*.png
      - name: Save screenshots on the capture branch
        env:
          CAPTURE_BRANCH: ${{ github.ref_name }}
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/main.png docs/screenshots/service.png
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m 'docs: add actual Windows application screenshots [skip ci]'
          git push origin "HEAD:$env:CAPTURE_BRANCH"
