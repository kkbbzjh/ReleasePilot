name: Build and Release Windows
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ReleasePilot.csproj -r win-x64
      - name: Publish single-file EXE
        run: dotnet publish ReleasePilot.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:DebugSymbols=false -o publish
      - name: Create SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/ReleasePilot.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ReleasePilot.exe" | Out-File -Encoding ascii publish/SHA256SUMS.txt
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReleasePilot-win-x64
          path: |
            publish/ReleasePilot.exe
            publish/SHA256SUMS.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'v0.2.0' }
          if ($env:GITHUB_REF_TYPE -eq 'branch') {
            $head = gh api "repos/$env:GITHUB_REPOSITORY/branches/main" --jq '.commit.sha'
            if ($head -ne $env:GITHUB_SHA) { Write-Host 'Superseded build; skipping release.'; exit 0 }
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $tag already exists."; exit 0 }
          gh release create $tag publish/ReleasePilot.exe publish/SHA256SUMS.txt --target $env:GITHUB_SHA --title "ReleasePilot $tag" --generate-notes
