name: Build and Release Windows
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Resolve release filename
        id: release_metadata
        shell: pwsh
        run: |
          [xml]$project = Get-Content ReleasePilot.csproj -Raw
          $version = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v$version" }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "Invalid release version: $tag"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "exe_name=ReleasePilot-$tag.exe" >> $env:GITHUB_OUTPUT
      - name: Restore
        run: dotnet restore ReleasePilot.csproj -r win-x64
      - name: Test versions and update operations
        run: dotnet run --project tests/VersionHelper.Tests/VersionHelper.Tests.csproj -c Release
      - name: Test shared WPF theme and dialogs
        timeout-minutes: 3
        run: dotnet run --project tests/UiSmoke.Tests/UiSmoke.Tests.csproj -c Release
      - name: Upload interface snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReleasePilot-ui-${{ steps.release_metadata.outputs.tag }}
          path: ui-screenshots/*.png
          if-no-files-found: ignore
      - name: Publish single-file EXE
        run: dotnet publish ReleasePilot.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:DebugSymbols=false -o publish
      - name: Verify published EXE version
        env:
          RELEASE_TAG: ${{ steps.release_metadata.outputs.tag }}
        shell: pwsh
        run: dotnet run --project tests/VersionHelper.Tests/VersionHelper.Tests.csproj -c Release --no-build -- publish/ReleasePilot.exe $env:RELEASE_TAG
      - name: Create SHA256 checksum
        env:
          EXE_NAME: ${{ steps.release_metadata.outputs.exe_name }}
        shell: pwsh
        run: |
          Rename-Item publish/ReleasePilot.exe $env:EXE_NAME
          $hash = (Get-FileHash "publish/$env:EXE_NAME" -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:EXE_NAME" | Out-File -Encoding ascii publish/SHA256SUMS.txt
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReleasePilot-${{ steps.release_metadata.outputs.tag }}-win-x64
          path: |
            publish/${{ steps.release_metadata.outputs.exe_name }}
            publish/SHA256SUMS.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_metadata.outputs.tag }}
          EXE_NAME: ${{ steps.release_metadata.outputs.exe_name }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if ($env:GITHUB_REF_TYPE -eq 'branch') {
            $head = gh api "repos/$env:GITHUB_REPOSITORY/branches/main" --jq '.commit.sha'
            if ($head -ne $env:GITHUB_SHA) { Write-Host 'Superseded build; skipping release.'; exit 0 }
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $tag already exists."; exit 0 }
          gh release create $tag "publish/$env:EXE_NAME" publish/SHA256SUMS.txt --target $env:GITHUB_SHA --title "ReleasePilot $tag" --generate-notes
